<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>HexQuest Economy</title>
    <link rel="icon" href="data:,">
    <style>
      body {
        background-color: #020617; /* even darker slate-950 */
        color: #e2e8f0; /* slate-200 */
        overflow: hidden;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0f172a; 
      }
      ::-webkit-scrollbar-thumb {
        background: #334155; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #475569; 
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Animations */
      @keyframes blob {
        0% { transform: translate(0px, 0px) scale(1); }
        33% { transform: translate(30px, -50px) scale(1.1); }
        66% { transform: translate(-20px, 20px) scale(0.9); }
        100% { transform: translate(0px, 0px) scale(1); }
      }
      .animate-blob {
        animation: blob 15s infinite ease-in-out;
      }
      .animation-delay-2000 {
        animation-delay: 2s;
      }
      .animation-delay-4000 {
        animation-delay: 4s;
      }
      
      .perspective-container {
        perspective: 800px;
        overflow: hidden;
      }
      
      .transform-3d {
        transform-style: preserve-3d;
      }
      
      .rotate-x-60 {
        transform: rotateX(60deg);
      }
      @media (max-width: 768px) {
        .rotate-x-60 {
          transform: rotateX(30deg);
        }
      }

      .mask-linear-fade {
        mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }
      .mask-linear-fade-right {
        mask-image: linear-gradient(to right, black 80%, transparent);
      }

      /* Terminal & Scanline effects */
      .bg-scanlines {
        background-image: linear-gradient(
          transparent 50%,
          rgba(0, 0, 0, 0.5) 50%
        );
        background-size: 100% 4px;
      }
      
      @keyframes scan {
        0% { transform: translateY(-100%); }
        100% { transform: translateY(100%); }
      }
      .animate-scan-slow {
        animation: scan 8s linear infinite;
      }

      /* Premium border-glow animation */
      @keyframes border-glow-anim {
        0%, 100% {
          border-color: rgba(99, 102, 241, 0.35);
          box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.95), 0 0 12px rgba(99, 102, 241, 0.25), inset 0 0 10px rgba(99, 102, 241, 0.15);
        }
        50% {
          border-color: rgba(52, 211, 153, 0.75);
          box-shadow: 0 10px 40px -10px rgba(0, 0, 0, 0.95), 0 0 24px rgba(52, 211, 153, 0.5), inset 0 0 14px rgba(52, 211, 153, 0.3);
        }
      }
      .animate-border-glow-premium {
        animation: border-glow-anim 4.5s infinite ease-in-out;
      }

    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
